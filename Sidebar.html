<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --ink: #202124; --muted: #5f6368; --line: #dadce0;
      --mark: #fce8b2; --accent: #1a73e8; --bg: #fff;
    }
    body {
      font: 13px/1.5 Roboto, Arial, sans-serif;
      color: var(--ink); background: var(--bg); margin: 0; padding: 12px;
    }
    header { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .count { font-size: 22px; font-weight: 500; }
    .density { color: var(--muted); font-size: 12px; }
    button {
      font: inherit; background: var(--accent); color: #fff; border: 0;
      border-radius: 4px; padding: 7px 14px; cursor: pointer; margin-top: 8px;
    }
    button:disabled { background: var(--muted); cursor: default; }
    .finding {
      border: 1px solid var(--line); border-radius: 6px;
      padding: 9px 10px; margin-top: 10px; cursor: pointer;
    }
    .finding:hover { border-color: var(--accent); }
    .tag {
      display: inline-block; font-size: 11px; line-height: 1.4;
      padding: 1px 8px; border-radius: 10px; margin-bottom: 6px;
      background: #e8f0fe; color: #1967d2;
    }
    .tag[data-rule="passive-agented"] { background: #feefe3; color: #b06000; }
    .tag[data-rule="nominalization-of"] { background: #f3e8fd; color: #7b1fa2; }
    .tag[data-rule="light-verb"] { background: #e8eaf6; color: #3949ab; }
    .tag[data-rule="padding-phrase"] { background: #e6f4ea; color: #137333; }
    .breakdown { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .breakdown span { margin-right: 10px; white-space: nowrap; }
    .context { color: var(--muted); font-size: 12px; }
    .context mark { background: var(--mark); color: var(--ink); }
    .question { margin-top: 7px; font-size: 12px; }
    .note, .error { font-size: 12px; margin-top: 12px; }
    .note { color: var(--muted); }
    .error { color: #c5221f; }
  </style>
</head>
<body>
  <header>
    <div class="count" id="count">—</div>
    <div class="density" id="density">Scan the document to begin.</div>
    <div class="breakdown" id="breakdown"></div>
    <button id="scan">Scan document</button>
  </header>
  <div id="results"></div>
  <div class="note" id="note"></div>

  <script>
    var scanButton = document.getElementById('scan');
    scanButton.addEventListener('click', runScan);

    function runScan() {
      scanButton.disabled = true;
      scanButton.textContent = 'Scanning…';
      document.getElementById('note').className = 'note';
      document.getElementById('note').textContent = '';
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(showError)
        .scanDocument();
    }

    function render(result) {
      resetButton();
      document.getElementById('count').textContent =
        result.findings.length + (result.findings.length === 1 ? ' finding' : ' findings');
      renderBreakdown(result.findings);
      document.getElementById('density').textContent =
        result.density + ' per 100 words · ' + result.wordCount + ' words scanned';

      var results = document.getElementById('results');
      results.innerHTML = '';
      result.findings.forEach(function (finding) {
        results.appendChild(buildCard(finding));
      });

      document.getElementById('note').textContent = result.findings.length === 0
        ? 'Nothing flagged. None of these patterns is an error on its own — each is a place worth a second look.'
        : 'Click any finding to select it in the document.';
    }

    function renderBreakdown(findings) {
      var counts = {};
      findings.forEach(function (f) {
        counts[f.ruleLabel] = (counts[f.ruleLabel] || 0) + 1;
      });
      var el = document.getElementById('breakdown');
      el.innerHTML = '';
      Object.keys(counts).sort().forEach(function (label) {
        var span = document.createElement('span');
        span.textContent = counts[label] + ' ' + label.toLowerCase();
        el.appendChild(span);
      });
    }

    function buildCard(finding) {
      var card = document.createElement('div');
      card.className = 'finding';

      var tag = document.createElement('div');
      tag.className = 'tag';
      tag.setAttribute('data-rule', finding.ruleId);
      tag.textContent = finding.ruleLabel;
      card.appendChild(tag);

      var context = document.createElement('div');
      context.className = 'context';
      context.innerHTML = markPhrase(finding.sentence, finding.phrase);

      var question = document.createElement('div');
      question.className = 'question';
      question.textContent = finding.question;

      card.appendChild(context);
      card.appendChild(question);
      card.addEventListener('click', function () {
        google.script.run
          .withFailureHandler(showError)
          .selectFinding(finding.childIndex, finding.start, finding.end);
      });
      return card;
    }

    function markPhrase(sentence, phrase) {
      var at = sentence.indexOf(phrase);
      if (at === -1) return escapeHtml(sentence);
      return escapeHtml(sentence.slice(0, at)) +
        '<mark>' + escapeHtml(phrase) + '</mark>' +
        escapeHtml(sentence.slice(at + phrase.length));
    }

    function escapeHtml(value) {
      var div = document.createElement('div');
      div.textContent = value;
      return div.innerHTML;
    }

    function showError(error) {
      resetButton();
      var note = document.getElementById('note');
      note.className = 'error';
      note.textContent = error && error.message ? error.message : String(error);
    }

    function resetButton() {
      scanButton.disabled = false;
      scanButton.textContent = 'Rescan document';
    }
  </script>
</body>
</html>
